[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "A file-first Telegram personal assistant backed by FastAPI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=46.0.5",
  "dateparser>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
personal-assistant = "personal_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
